<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>KBS TV - Player Totem (Anti-Trava Corrigido)</title>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; cursor: pointer; }
        .admin-layer { position: absolute; overflow: hidden; display: block; }
        .video-js { width: 100% !important; height: 100% !important; }
        .vjs-tech { object-fit: fill !important; } 
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 1px; background: #000; width: 100%; height: 100%; }
        .quadrado { background: #050505; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        img { width: 100%; height: 100%; object-fit: fill; display: block; }
    </style>
</head>
<body onclick="liberarGeral()">

    <div id="v-layer" class="admin-layer">
        <video id="vid1" class="video-js vjs-default-skin" playsinline autoplay></video>
    </div>
    
    <div id="vb-layer" class="admin-layer">
        <video id="vid2" class="video-js vjs-default-skin" playsinline muted loop autoplay></video>
    </div>
    
    <div id="g-layer" class="admin-layer">
        <div class="grid" id="gradePrincipal"></div>
    </div>

<script>
    // Configurações Firebase
    const mkt = firebase.initializeApp({
        apiKey: "AIzaSyBh-dhSMEgVO0dPyPdE-JAtPb2LeKaq9og",
        databaseURL: "https://marketing-19f3d-default-rtdb.firebaseio.com"
    }, "mktApp").database();

    const lay = firebase.initializeApp({ 
        apiKey: "AIzaSyDB_upDIT_fPCFvh9rcldaQu-SkbW1usFs",
        databaseURL: "https://totem-full-tv2-default-rtdb.firebaseio.com" 
    }, "layApp").database();

    // CORREÇÃO CRUCIAL: Iniciar mudo por padrão para o navegador autorizar o autoplay no Wix/GitHub
    const p1 = videojs('vid1', { 
        controls: false, 
        autoplay: true, 
        muted: true, // Começa mudo para passar na restrição do browser
        html5: { hls: { overrideNative: true } }
    });
    
    const p2 = videojs('vid2', { controls: false, autoplay: true, loop: true, muted: true });
    
    const streamUrl = "http://157.245.131.127/hls/canal1/stream.m3u8";
    p1.src({ src: streamUrl, type: "application/x-mpegURL" });

    // --- LÓGICA ANTI-TRAVA (Watchdog) ---
    let lastTime = -1;
    let freezeCount = 0;

    setInterval(() => {
        let currentTime = p1.currentTime();
        if (currentTime === lastTime && !p1.paused()) {
            freezeCount++;
            if (freezeCount > 2) { 
                console.log("Detectado travamento. Reiniciando stream...");
                p1.src({ src: streamUrl, type: "application/x-mpegURL" });
                p1.play().catch(e => console.log("Erro no reload do watch:", e));
                freezeCount = 0;
            }
        } else {
            freezeCount = 0;
        }
        lastTime = currentTime;
    }, 5000); 
    // ------------------------------------

    function liberarGeral() {
        // Ao clicar na tela, desmuta o player principal e garante o play
        if (p1.muted()) {
            p1.muted(false);
            p1.volume(1);
            console.log("Interação detectada: Áudio liberado.");
        }
        p1.play();
        p2.play();
    }

    p1.ready(() => {
        p1.play().catch(() => console.log("Aguardando interação do usuário para iniciar o player."));
    });

    // Grade de Anúncios
    let anuncios = [];
    let slideIdx = Array(17).fill(0);
    const grade = document.getElementById('gradePrincipal');
    for(let i=1; i<=16; i++) { grade.innerHTML += `<div class="quadrado" id="q${i}"></div>`; }

    mkt.ref('anuncios').on('value', snap => {
        anuncios = []; snap.forEach(c => { anuncios.push(c.val()); });
        atualizar(); 
    });

    function atualizar() {
        const h = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', hour12: false, timeZone: 'America/Sao_Paulo'});
        const d = new Date().getDay();
        for(let i=1; i<=16; i++) {
            const box = document.getElementById(`q${i}`);
            const ativos = anuncios.filter(a => parseInt(a.pos) === i && a.days.includes(d) && (h >= a.start && h <= a.end));
            if (ativos.length > 0) {
                box.innerHTML = `<img src="${ativos[slideIdx[i] % ativos.length].url}">`;
            } else { box.innerHTML = ""; }
        }
    }
    setInterval(atualizar, 1000);
    setInterval(() => { for(let i=1; i<=16; i++) slideIdx[i]++; atualizar(); }, 15000);

    // Sincronia de Layout
    lay.ref('layout_totem').on('value', snap => {
        const s = snap.val(); if(!s) return;
        const mover = (id, d) => {
            const el = document.getElementById(id);
            if(!d || !el) return;
            el.style.left = d.x + "%"; el.style.top = d.y + "%";
            el.style.width = d.w + "%"; el.style.height = d.h + "%";
            el.style.transform = `rotate(${d.r || 0}deg)`;
        };
        mover('v-layer', s.video);
        mover('g-layer', s.grade);
        mover('vb-layer', s.vidBanner);

        if(s.vidBanner?.url && p2.src() !== s.vidBanner.url) {
            p2.src({ src: s.vidBanner.url, type: s.vidBanner.url.includes('m3u8') ? "application/x-mpegURL" : "video/mp4" });
        }
    });
</script>
</body>
</html>
